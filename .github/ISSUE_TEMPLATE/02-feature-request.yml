name: "💡 功能建议 / Feature Request"
description: "为 legado-server 提出新功能建议或体验改进想法"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！
        在提交前，请先搜索 [Discussions 灵感区](https://github.com/lukelzlz/legado-server/discussions/categories/ideas) 与 [Issues](https://github.com/lukelzlz/legado-server/issues) 确认是否已有类似提议。

  - type: checkboxes
    attributes:
      label: "前置核对 / Checklist"
      options:
        - label: "已搜索现有 Issues 与 Discussions，未发现相似提案"
          required: true
        - label: "该功能符合 legado-server 的无头服务端与 Web 阅读器定位"
          required: true

  - type: dropdown
    id: category
    attributes:
      label: "功能分类 / Category"
      options:
        - "Web 阅读器体验 (排版 / 翻页 / 主题 / 快捷键)"
        - "TTS 朗读增强 (音色 / 会话控制 / 快捷操作)"
        - "书源与规则能力 (解析 / 搜索 / 替换净化 / 导入导出)"
        - "服务端架构与 API (鉴权 / 多用户 / 数据备份 / 同步)"
        - "离线与 PWA 体验"
        - "部署运维 (Docker / 配置项 / 性能)"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: "需求背景 / Motivation & Problem Statement"
      description: "为什么需要这个功能？当前遇到了什么不便或痛点？"
      placeholder: "例如：在使用宽屏显示器阅读时，目前的双栏排版间距..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "期望方案 / Proposed Solution"
      description: "您期望如何实现或呈现该功能？"
      placeholder: "清晰描述您期望的交互、界面表现或 API 设计..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "备选方案 / Alternative Solutions"
      description: "您是否考虑过其他替代解法？"
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: "参考设计或原型草图 / Mockups & References"
      description: "如有参考软件截图或草图，请直接粘贴至此处"
