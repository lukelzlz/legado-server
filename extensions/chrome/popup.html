<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Legado Cookie 同步助手</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #fafafa;
      color: #222;
    }
    h3 { margin: 0 0 12px; font-size: 15px; color: #2e7d32; display: flex; align-items: center; gap: 6px; }
    .site-info { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; margin-bottom: 12px; font-size: 12px; }
    .site-info strong { display: block; font-size: 13px; color: #111; word-break: break-all; margin-top: 2px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #555; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    button {
      width: 100%;
      padding: 9px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1b5e20; }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; text-align: center; display: none; padding: 8px; border-radius: 4px; line-height: 1.4; }
    #status.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    #status.error { display: block; background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
  </style>
</head>
<body>
  <h3>🍪 阅读服务器 Cookie 同步</h3>
  <div class="site-info">
    <span>当前站点：</span>
    <strong id="current-host">加载中...</strong>
  </div>
  <div class="form-group">
    <label>阅读服务器地址：</label>
    <input type="text" id="server-url" value="http://127.0.0.1:8080" placeholder="http://127.0.0.1:8080">
  </div>
  <button id="sync-btn">一键同步 Cookie (含 HttpOnly)</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
