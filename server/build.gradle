plugins {
    alias libs.plugins.kotlin.jvm
    alias libs.plugins.kotlin.serialization
    id 'application'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}


group = 'io.legado'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

application {
    applicationName = 'legado-server'
    mainClass = 'io.legado.server.ApplicationKt'
}

tasks.register('fatJar', Jar) {
    archiveBaseName.set('legado-server')
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': 'io.legado.server.ApplicationKt',
            'Implementation-Title': 'Legado Server',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with tasks.jar
}

def webDistDir = file("${rootProject.projectDir}/web/dist")

tasks.register('buildWeb') {
    description = "Builds the web frontend using npm."
    group = "build"

    def webSrc = file("${rootProject.projectDir}/web/src")
    def webPkg = file("${rootProject.projectDir}/web/package.json")
    def webHtml = file("${rootProject.projectDir}/web/index.html")
    def webVite = file("${rootProject.projectDir}/web/vite.config.ts")

    if (webSrc.exists()) inputs.dir(webSrc)
    if (webPkg.exists()) inputs.file(webPkg)
    if (webHtml.exists()) inputs.file(webHtml)
    if (webVite.exists()) inputs.file(webVite)
    outputs.dir(webDistDir)

    doLast {
        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def hasNpm = false
        try {
            def process = new ProcessBuilder(isWindows ? ['cmd', '/c', 'where', 'npm'] : ['which', 'npm']).start()
            hasNpm = (process.waitFor() == 0)
        } catch (Exception ignored) {
            hasNpm = false
        }

        def webNodeModules = file("${rootProject.projectDir}/web/node_modules")
        if (hasNpm && file("${rootProject.projectDir}/web/package.json").exists()) {
            if (webNodeModules.exists()) {
                println "Building web frontend with npm..."
                exec {
                    workingDir = file("${rootProject.projectDir}/web")
                    commandLine isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
                }
            } else if (webDistDir.exists() && file("${webDistDir}/index.html").exists()) {
                println "Using pre-built web assets from ${webDistDir} (node_modules not found, skipping npm build)"
            } else {
                println "Installing web frontend dependencies and building with npm..."
                exec {
                    workingDir = file("${rootProject.projectDir}/web")
                    commandLine isWindows ? ['cmd', '/c', 'npm', 'install', '--ignore-scripts', '--no-audit', '--fund=false'] : ['npm', 'install', '--ignore-scripts', '--no-audit', '--fund=false']
                }
                exec {
                    workingDir = file("${rootProject.projectDir}/web")
                    commandLine isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
                }
            }
        } else if (webDistDir.exists()) {
            println "Using pre-built web assets from ${webDistDir}"
        } else {
            logger.warn("WARNING: Neither npm nor pre-built web/dist was found. Web static files will not be bundled!")
        }
    }
}

processResources {
    dependsOn tasks.named('buildWeb')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(webDistDir) {
        into("static")
    }
}

dependencies {
    implementation "io.ktor:ktor-server-cio:3.4.3"
    implementation "io.ktor:ktor-server-core:3.4.3"
    implementation "io.ktor:ktor-server-content-negotiation:3.4.3"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.4.3"
    implementation "io.ktor:ktor-server-sessions:3.4.3"
    implementation "io.ktor:ktor-server-websockets:3.4.3"
    implementation "io.ktor:ktor-server-status-pages:3.4.3"
    implementation "org.xerial:sqlite-jdbc:3.49.1.0"
    implementation "org.jsoup:jsoup:1.18.3"
    implementation "com.jayway.jsonpath:json-path:2.9.0"
    implementation "org.mozilla:rhino:1.8.0"
    implementation "org.slf4j:slf4j-simple:2.0.16"
    testImplementation "io.ktor:ktor-server-test-host:3.4.3"
    testImplementation "io.ktor:ktor-client-content-negotiation:3.4.3"
    testImplementation libs.junit
}

